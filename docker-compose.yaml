services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: taskdb
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports: 
      - "5000:5000"
    environment: 
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: taskdb
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: