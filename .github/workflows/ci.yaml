name: pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services: 
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: taskdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
  
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12' 

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: test 
        run: pytest
          env:
            DB_HOST: 127.0.0.1
            DB_USER: root 
            DB_PASSWORD: testpassword 
            DB_NAME: taskdb

 