name: Python CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Flask Flask-SQLAlchemy "psycopg[binary]"

    - name: Start Flask Application
      run: |
        export DATABASE_URL="sqlite:///:memory:"
        python app.py &
        sleep 3

    - name: Run End-to-End API Integration Tests
      run: |
        # 1. Create a task (POST)
        echo "=== Testing POST /tasks ==="
        POST_RESPONSE=$(curl -s -X POST -H "Content-Type: application/json" -d "{\"title\": \"Verify Pipeline Status\", \"description\": \"Ensure CI works\"}" http://127.0.0.1:5000/tasks)
        echo "POST Response: $POST_RESPONSE"
        echo "$POST_RESPONSE" | grep -q '"id":1'
        
        # 2. Complete the task (PATCH)
        echo "=== Testing PATCH /tasks/1 ==="
        PATCH_RESPONSE=$(curl -s -X PATCH http://127.0.0.1:5000/tasks/1)
        echo "PATCH Response: $PATCH_RESPONSE"
        echo "$PATCH_RESPONSE" | grep -q '"completed":true'
