name: pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services: 
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: taskdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
  
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12' 

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: test 
        run: pytest
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root 
          DB_PASSWORD: testpassword 
          DB_NAME: taskdb
  
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{  secrets.DOCKERHUB_USERNAME  }}
          password: ${{  secrets.DOCKERHUB_TOKEN  }}

      - name: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{  github.event_name != 'pull_request'  }}
          tags: |
            ${{  secrets.DOCKERHUB_USERNAME  }}/task-tracker-api:${{  github.sha  }}
            ${{  secrets.DOCKERHUB_USERNAME  }}/task-tracker-api:latest
          cache-from: type=gha
          cache-to: type=gha, mode=max

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    if: github.event_name == 'push'
    steps:
      - name: checkout code
        uses: actions/checkout@v4 
      
      - name: Apply k8s manifests
        run: kubectl apply -f k8s/

      - name: updated deployment image 
        run: kubectl set image deployment/task-tracker-api task-tracker-api=${{ secrets.DOCKERHUB_USERNAME }}/task-tracker-api:${{ github.sha }}

      - name: verify rolling update
        run: kubectl rollout status deployment/task-tracker-api --timeout=120s

 